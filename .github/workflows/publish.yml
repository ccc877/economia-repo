name: Publicar la web del libro

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes de R necesarios
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::kableExtra

      - name: Comprobar paquetes de R
        run: |
          Rscript -e 'paquetes <- c("ggplot2", "knitr", "rmarkdown", "kableExtra"); faltan <- paquetes[!vapply(paquetes, requireNamespace, logical(1), quietly = TRUE)]; if (length(faltan)) stop("No se han instalado: ", paste(faltan, collapse = ", "))'

      - name: Renderizar el libro a HTML
        run: quarto render --to html

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
