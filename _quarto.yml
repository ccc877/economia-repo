project:
  type: book

lang: es

# El conmutador de tema oscuro es el de Quarto (format.html.theme con light y
# dark). Lo único que hay que añadir a mano es el puente con el iframe de la
# solución interactiva: un iframe no hereda nada del padre, así que hay que
# vigilant los cambios de tema y comunicárselos. Con MutationObserver sobre el
# atributo en lugar de un segundo conmutador, para no pelearse con el de Quarto.
include-in-header:
  text: |
    <script>
    (function () {
      function avisarIframes() {
        var tema = document.documentElement.getAttribute("data-bs-theme");
        if (!tema) return;
        var marcos = document.querySelectorAll("iframe");
        for (var i = 0; i < marcos.length; i++) {
          try { marcos[i].contentWindow.postMessage({ tipo: "tema-iframe", tema: tema }, "*"); }
          catch (e) {}
        }
      }
      window.addEventListener("message", function (ev) {
        var f = ev.source;
        if (!ev.data) return;
        if (ev.data.tipo === "altura-iframe" && f && f.tagName === "IFRAME") {
          f.style.height = (ev.data.alto + 4) + "px";
        }
        if (ev.data.tipo === "tema-iframe-listo") avisarIframes();
      });
      window.avisoTemaIframes = avisarIframes;

      // El conmutador de tema es el de Quarto: lo que hace falta es colocarlo en
      // un sitio visible. Su respaldo automático (para proyectos book, sin navbar)
      // cuelga el boton del body y no trae reglas de posicion, asi que acaba al
      // final de la pagina. Le ponemos la clase de Quarto para que herede el
      // icono y el estado, pero lo insertamos en la barra de navegacion.
      function ponerConmutador() {
        if (window.document.querySelector(".quarto-color-scheme-toggle")) return;
        var nav = window.document.querySelector(".quarto-secondary-nav .container-fluid")
               || window.document.querySelector(".navbar");
        if (!nav) return;
        var a = window.document.createElement("a");
        a.className = "quarto-color-scheme-toggle conmutador-tema";
        a.href = "";
        a.title = "Cambiar entre tema claro y oscuro";
        a.setAttribute("aria-label", "Cambiar entre tema claro y oscuro");
        a.onclick = function () {
          try { window.quartoToggleColorScheme(); } catch (e) {}
          return false;
        };
        var i = window.document.createElement("i");
        i.className = "bi";
        a.appendChild(i);
        nav.appendChild(a);
      }

      document.addEventListener("DOMContentLoaded", function () {
        ponerConmutador();
        avisarIframes();
        new MutationObserver(avisarIframes).observe(document.documentElement,
          { attributes: true, attributeFilter: ["data-bs-theme", "data-theme"] });
      });
    })();
    </script>
    <style>
      .conmutador-tema {
        margin-left: auto;
        padding: 0.25rem 0.55rem;
        font-size: 1.05rem;
        line-height: 1;
        text-decoration: none;
      }
    </style>

book:
  title: "Economía"
  subtitle: "1.º de Bachillerato"
  chapters:
    - index.qmd
    - part: "Unidad 1. Decisión, comportamiento y método"
      chapters:
        - tema-01.qmd
        - tema-02.qmd
        - tema-03.qmd
    - part: "Unidad 2. Microeconomía y mercados"
      chapters:
        - tema-04.qmd
        - tema-05.qmd
        - tema-06.qmd
        - tema-07.qmd
    - part: "Unidad 3. Macroeconomía y desarrollo"
      chapters:
        - tema-08.qmd
        - tema-09.qmd
    - part: "Unidad 4. Sistema financiero y política monetaria"
      chapters:
        - tema-10.qmd
        - tema-11.qmd
    - part: "Unidad 5. Política fiscal y sector público"
      chapters:
        - tema-12.qmd
    - part: "Unidad 6. Comercio, globalización y retos actuales"
      chapters:
        - tema-13.qmd
        - tema-14.qmd

format:
  html:
    # Modo oscuro nativo de Quarto: se le da un tema para cada modo y Quarto
    # pone el conmutador en la barra de navegación. Cargar los dos es lo correcto
    # aquí, porque el índice lateral y el resto de CSS del tema también cambian.
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    css: styles.css
  pdf:
    keep-tex: true
    toc: true
    toc-depth: 3
    number-sections: true
    documentclass: scrbook
    papersize: a4
    geometry:
      - top=2.4cm
      - bottom=2.4cm
      - left=2.2cm
      - right=2.2cm
    fontsize: 11pt
    linkcolor: blue
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{longtable}
        \usepackage{array}
        \usepackage{float}
        \renewcommand{\partname}{Parte}

execute:
  echo: false
  warning: false
  message: false
