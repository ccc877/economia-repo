project:
  type: book

lang: es

# Modo oscuro. Bootstrap 5.3 lo soporta de forma nativa con el atributo
# `data-bs-theme` en <html>, así que no hace falta cargar un segundo tema: basta
# un script que fije el atributo antes de pintar (para que no haya destello) y
# un botón en la barra de navegación.Va en línea a propósito: así el mismo bloque
# funciona en el libro y en el proyecto de ejercicios sin rutas que ajustar.
include-in-header:
  text: |
    <script>
    (function () {
      var CLAVE = "eco-modo";
      var raiz = document.documentElement;

      function guardado() {
        try { return localStorage.getItem(CLAVE); } catch (e) { return null; }
      }
      function porDefectoOscuro() {
        return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }
      function aplicar(oscuro) {
        raiz.setAttribute("data-bs-theme", oscuro ? "dark" : "light");
      }

      // Antes de pintar nada, para evitar el destello de tema claro.
      var elegido = guardado();
      aplicar(elegido === null ? porDefectoOscuro() : elegido === "oscuro");

      function ponerBoton() {
        var nav = document.querySelector(".navbar");
        if (!nav || document.getElementById("boton-modo")) return;

        var boton = document.createElement("button");
        boton.id = "boton-modo";
        boton.type = "button";
        boton.className = "btn btn-sm btn-outline-secondary boton-modo";
        boton.title = "Cambiar entre modo claro y oscuro";

        function pintar() {
          var oscuro = raiz.getAttribute("data-bs-theme") === "dark";
          boton.textContent = oscuro ? "☀" : "☾";
          boton.setAttribute("aria-label", oscuro ? "Activar modo claro" : "Activar modo oscuro");
        }

        boton.addEventListener("click", function () {
          var oscuro = raiz.getAttribute("data-bs-theme") === "dark";
          aplicar(!oscuro);
          try { localStorage.setItem(CLAVE, !oscuro ? "oscuro" : "claro"); } catch (e) {}
          pintar();
          avisarIframes();
        });

        nav.appendChild(boton);
        pintar();
      }

      // Los iframes (la solución interactiva) son documentos aparte: hay que
      //lles decir en qué tema están, porque no heredan nada del padre.
      function avisarIframes() {
        var tema = raiz.getAttribute("data-bs-theme");
        var marcos = document.querySelectorAll("iframe");
        for (var i = 0; i < marcos.length; i++) {
          try {
            marcos[i].contentWindow.postMessage({ tipo: "tema-iframe", tema: tema }, "*");
          } catch (e) {}
        }
      }
      window.addEventListener("message", function (ev) {
        var f = ev.source;
        if (!ev.data) return;
        if (ev.data.tipo === "altura-iframe" && f && f.tagName === "IFRAME") {
          f.style.height = (ev.data.alto + 4) + "px";
        }
        // El iframe acaba de cargar y quiere saber en qué tema está.
        if (ev.data.tipo === "tema-iframe-listo") avisarIframes();
      });
      window.avisoTemaIframes = avisarIframes;

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", ponerBoton);
      } else {
        ponerBoton();
      }
    })();
    </script>
    <style>
      /* El botón se ancla a la derecha de la barra de navegación. */
      .boton-modo { margin-left: auto; min-width: 2.4rem; }
      @media (min-width: 992px) {
        .navbar-expand-lg .navbar-nav { margin-right: 3rem; }
        .boton-modo { margin-right: 0.5rem; }
      }
      /* Los material en color propio del proyecto (solo la portada) hay que
         adaptarlos a mano: Bootstrap no los conoce. */
      [data-bs-theme="dark"] .resource-navigation a {
        background: #1b2634;
        border-color: #33455c;
        color: #9ecbff;
      }
      [data-bs-theme="dark"] .resource-navigation a:hover {
        background: #24344a;
        border-color: #4a6b8a;
      }
      [data-bs-theme="dark"] .placeholder-link,
      [data-bs-theme="dark"] .placeholder-status { color: #8a949e; }
      /* El desplegable de un ejercicio lleva fondo blanco propio. */
      [data-bs-theme="dark"] .callout { --bs-callout-bg: #1b2634; }
    </style>

book:
  title: "Economía"
  subtitle: "1.º de Bachillerato"
  chapters:
    - index.qmd
    - part: "Unidad 1. Decisión, comportamiento y método"
      chapters:
        - tema-01.qmd
        - tema-02.qmd
        - tema-03.qmd
    - part: "Unidad 2. Microeconomía y mercados"
      chapters:
        - tema-04.qmd
        - tema-05.qmd
        - tema-06.qmd
        - tema-07.qmd
    - part: "Unidad 3. Macroeconomía y desarrollo"
      chapters:
        - tema-08.qmd
        - tema-09.qmd
    - part: "Unidad 4. Sistema financiero y política monetaria"
      chapters:
        - tema-10.qmd
        - tema-11.qmd
    - part: "Unidad 5. Política fiscal y sector público"
      chapters:
        - tema-12.qmd
    - part: "Unidad 6. Comercio, globalización y retos actuales"
      chapters:
        - tema-13.qmd
        - tema-14.qmd

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    theme: cosmo
    css: styles.css
  pdf:
    keep-tex: true
    toc: true
    toc-depth: 3
    number-sections: true
    documentclass: scrbook
    papersize: a4
    geometry:
      - top=2.4cm
      - bottom=2.4cm
      - left=2.2cm
      - right=2.2cm
    fontsize: 11pt
    linkcolor: blue
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{longtable}
        \usepackage{array}
        \usepackage{float}
        \renewcommand{\partname}{Parte}

execute:
  echo: false
  warning: false
  message: false
