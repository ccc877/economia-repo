format:
  html:
    # Mismo criterio que el libro: tema claro y oscuro, conmutador de Quarto.
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    link-external-newwindow: true

execute:
  echo: false
  warning: false
  message: false
