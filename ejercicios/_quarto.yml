project:
  type: book
  # Se renderiza dentro del _book/ del proyecto principal, para que la landing
  # (que vive en _book/index.html) pueda enlazar con rutas relativas normales.
  output-dir: ../_book/ejercicios

lang: es

# Puente con el iframe de la solución interactiva, idéntico al del libro: un
# iframe no hereda nada del padre, así que hay que vigilar el cambio de tema y
# comunicárselo. El conmutador es el de Quarto.
include-in-header:
  text: |
    <script>
    (function () {
      function avisarIframes() {
        var tema = document.documentElement.getAttribute("data-bs-theme");
        if (!tema) return;
        var marcos = document.querySelectorAll("iframe");
        for (var i = 0; i < marcos.length; i++) {
          try { marcos[i].contentWindow.postMessage({ tipo: "tema-iframe", tema: tema }, "*"); }
          catch (e) {}
        }
      }
      window.addEventListener("message", function (ev) {
        var f = ev.source;
        if (!ev.data) return;
        if (ev.data.tipo === "altura-iframe" && f && f.tagName === "IFRAME") {
          f.style.height = (ev.data.alto + 4) + "px";
        }
        if (ev.data.tipo === "tema-iframe-listo") avisarIframes();
      });
      window.avisoTemaIframes = avisarIframes;

      // El conmutador de tema es el de Quarto: lo que hace falta es colocarlo en
      // un sitio visible. Su respaldo automático (para proyectos book, sin navbar)
      // cuelga el boton del body y no trae reglas de posicion, asi que acaba al
      // final de la pagina. Le ponemos la clase de Quarto para que herede el
      // icono y el estado, pero lo insertamos en la barra de navegacion.
      function ponerConmutador() {
        if (window.document.querySelector(".quarto-color-scheme-toggle")) return;
        var nav = window.document.querySelector(".quarto-secondary-nav .container-fluid")
               || window.document.querySelector(".navbar");
        if (!nav) return;
        var a = window.document.createElement("a");
        a.className = "quarto-color-scheme-toggle conmutador-tema";
        a.href = "";
        a.title = "Cambiar entre tema claro y oscuro";
        a.setAttribute("aria-label", "Cambiar entre tema claro y oscuro");
        a.onclick = function () {
          try { window.quartoToggleColorScheme(); } catch (e) {}
          return false;
        };
        var i = window.document.createElement("i");
        i.className = "bi";
        a.appendChild(i);
        nav.appendChild(a);
      }

      function ponerEnlaceInicio() {
        if (window.document.querySelector(".enlace-inicio")) return;
        var nav = window.document.querySelector(".quarto-secondary-nav .container-fluid")
               || window.document.querySelector(".navbar");
        if (!nav) return;
        var a = window.document.createElement("a");
        var esEjercicios = window.location.pathname.indexOf("/ejercicios/") !== -1;
        a.className = "enlace-inicio";
        a.href = esEjercicios ? "../index.html" : "./index.html";
        a.textContent = "Inicio";
        a.title = "Volver a la página de inicio";
        a.setAttribute("aria-label", "Volver a la página de inicio");
        var buscar = nav.querySelector(".quarto-search-button");
        if (buscar) nav.insertBefore(a, buscar);
        else nav.appendChild(a);
      }

      document.addEventListener("DOMContentLoaded", function () {
        ponerConmutador();
        ponerEnlaceInicio();
        avisarIframes();
        new MutationObserver(avisarIframes).observe(document.documentElement,
          { attributes: true, attributeFilter: ["data-bs-theme", "data-theme"] });
      });
    })();
    </script>
    <style>
      .conmutador-tema {
        margin-left: auto;
        padding: 0.25rem 0.55rem;
        font-size: 1.05rem;
        line-height: 1;
        text-decoration: none;
      }

      .enlace-inicio {
        flex: 0 0 auto;
        margin: 0 0.75rem 0 0.5rem;
        padding: 0.2rem 0.65rem;
        border: 1px solid var(--bs-border-color);
        border-radius: 0.25rem;
        color: var(--bs-body-color);
        text-decoration: none;
        font-weight: 500;
      }

      .enlace-inicio:hover {
        color: var(--bs-primary);
        border-color: var(--bs-primary);
      }
    </style>

# Los ficheros HTML del cuaderno (los explainers interactivos) no se renderizan,
# pero hay que copiarlos a la salida para poder enlazarlos o incrustarlos.
